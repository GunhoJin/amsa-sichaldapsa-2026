<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점수판 · 야간 프로그램</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:#151516; --line:#28282a;
    --ink:#f5f4f0; --muted:#8d8c88; --faint:#575653;
    --accent:#ff6b62; --gold:#ffc94a;
    --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Consolas",monospace;
  }
  /* 무대 상영용 도구 — TV/투영 전용, 야간 도구(제시어 공개기)와 동일 톤으로 어두운 단일 테마 고정 */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-feature-settings:"tnum";
    display:flex; flex-direction:column; overflow:hidden;
  }
  header.top{
    flex:0 0 auto; display:flex; align-items:center; gap:14px;
    padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  header.top h1{font-size:15px; margin:0; font-weight:800; letter-spacing:-.01em}
  header.top .sub{font-family:var(--mono); font-size:11px; color:var(--muted)}
  header.top .spacer{flex:1}
  .link-btn, .btn{
    font:inherit; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.03em;
    color:var(--muted); background:none; border:1px solid var(--line); border-radius:6px;
    padding:8px 13px; cursor:pointer; text-decoration:none;
  }
  .link-btn:hover, .btn:hover{color:var(--ink); border-color:var(--muted)}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-height:0}
  .board{width:100%; max-width:980px}
  .rows{display:flex; flex-direction:column; gap:10px}
  .row{
    display:grid; grid-template-columns:130px repeat(4,1fr); gap:10px; align-items:stretch;
  }
  .row .label{
    display:flex; align-items:center; font-family:var(--mono); font-size:clamp(11px,1.3vw,14px);
    color:var(--muted); font-weight:700; letter-spacing:.01em;
  }
  .cell{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .cell .team{font-size:clamp(11px,1.2vw,13px); color:var(--faint); font-family:var(--mono)}
  .cell .val{font-size:clamp(22px,3.2vw,34px); font-weight:800; font-variant-numeric:tabular-nums}
  .cell .pm{display:flex; gap:6px}
  .cell .pm button{
    font:inherit; font-family:var(--mono); font-size:15px; font-weight:800; width:32px; height:28px;
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  }
  .cell .pm button:hover{border-color:var(--muted)}

  .row.total .cell{
    background:var(--bg); border-color:var(--line); padding:16px 10px;
  }
  .row.total .cell .val{font-size:clamp(30px,4.4vw,46px)}
  .row.total .cell.lead{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset}
  .row.total .cell.lead .val{color:var(--gold)}
  .crown{font-size:clamp(14px,1.6vw,18px)}

  footer.ctrl{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:14px 20px; border-top:1px solid var(--line); flex-wrap:wrap;
  }
  .hint{font-family:var(--mono); font-size:11px; color:var(--faint)}
  footer.ctrl .spacer{flex:1}

  @media (max-width:640px){
    .row{grid-template-columns:70px repeat(4,1fr); gap:6px}
    .row .label{font-size:10px}
  }
</style>
</head>
<body>

<header class="top">
  <h1>🏆 점수판</h1>
  <span class="sub">3라운드 종합 — 뒷정리 선택 순서(CUE4) 기준</span>
  <span class="spacer"></span>
  <a class="link-btn" href="highschool-night-reveal.html">🖥️ 제시어 도구</a>
  <a class="link-btn" href="highschool-cuesheet-night.html">← 야간 큐</a>
</header>

<main>
  <div class="board">
    <div class="rows" id="rows"></div>
  </div>
</main>

<footer class="ctrl">
  <span class="hint">각 팀 칸의 +/− 로 정답 수를 기록하세요. 합계 최고점 팀에 👑 표시됩니다.</span>
  <span class="spacer"></span>
  <button class="btn" onclick="resetAll()">전체 리셋</button>
</footer>

<script>
const TEAMS = ["1조","2조","3조","4조"];
const ROUNDS = [
  {key:"music", label:"음악 1초 듣기"},
  {key:"telepathy", label:"이심전심"},
  {key:"charades", label:"몸으로 말해요"},
];

let scores = ROUNDS.reduce((acc,r)=>{ acc[r.key]=[0,0,0,0]; return acc; },{});

function change(roundKey, teamIdx, delta){
  scores[roundKey][teamIdx] = Math.max(0, scores[roundKey][teamIdx]+delta);
  render();
}
function totals(){
  return TEAMS.map((_,i)=> ROUNDS.reduce((sum,r)=> sum+scores[r.key][i], 0));
}
function resetAll(){
  ROUNDS.forEach(r=> scores[r.key]=[0,0,0,0]);
  render();
}

function render(){
  const rowsEl = document.getElementById("rows");
  let html = "";

  ROUNDS.forEach(r=>{
    html += `<div class="row"><div class="label">${r.label}</div>`;
    TEAMS.forEach((t,i)=>{
      html += `<div class="cell">
        <span class="team">${t}</span>
        <span class="val">${scores[r.key][i]}</span>
        <span class="pm">
          <button onclick="change('${r.key}',${i},-1)">−</button>
          <button onclick="change('${r.key}',${i},1)">+</button>
        </span>
      </div>`;
    });
    html += `</div>`;
  });

  const tot = totals();
  const max = Math.max(...tot);
  html += `<div class="row total"><div class="label">합계</div>`;
  TEAMS.forEach((t,i)=>{
    const isLead = tot[i]===max && max>0;
    html += `<div class="cell ${isLead?'lead':''}">
      <span class="team">${t} ${isLead?'<span class=\"crown\">👑</span>':''}</span>
      <span class="val">${tot[i]}</span>
    </div>`;
  });
  html += `</div>`;

  rowsEl.innerHTML = html;
}
render();
</script>
</body>
</html>
